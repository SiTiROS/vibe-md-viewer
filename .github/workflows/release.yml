# Release, automatically: when CI passes on main and the version in Cargo.toml has no release
# yet → build, tests, installer, zip, checksums, licenses → a GitHub release vX.Y.Z (the tag is
# created on the very commit CI checked), described by CHANGELOG.md. Ordinary commits don't
# release anything: a release is a version bump in Cargo.toml (+ CHANGELOG). Manual re-run:
# Actions → Release → Run workflow (main only; skipped if the version is already released).
#
# The exe is built here, from the checked sources — not on someone's computer. The build
# (where third-party crate build scripts run) has no write access to the repository;
# a separate job that builds nothing publishes the release. The origin of the files is
# attested by GitHub: gh attestation verify <file> -R SiTiROS/vibe-md-viewer
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time: a second run for the same version waits and then finds it released.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    # Only a successful CI run of a push to main of this repository (never a pull request or a fork).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      sha: ${{ steps.ver.outputs.sha }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Version from Cargo.toml, already released?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ver=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Unexpected version '$ver' in Cargo.toml"; exit 1; fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/git/ref/tags/v$ver" --silent 2>/dev/null; then
            echo "v$ver is already released — nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$ver is new — releasing."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and verify
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write
    env:
      VER: ${{ needs.check.outputs.ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Tests, build, package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package.ps1

      - name: Self-test on a live window
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/selftest.ps1 -Exe dist/vibe-md-viewer.exe

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText('CHANGELOG.md', [Text.Encoding]::UTF8)
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($env:VER))\b.*?\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $notes += "`n`n---`nInstall: download ``vibe-md-viewer-$env:VER-setup.exe`` and run it. Checksums are in ``vibe-md-viewer-$env:VER.sha256.txt``; verify the origin of the file: ``gh attestation verify vibe-md-viewer-$env:VER-setup.exe -R SiTiROS/vibe-md-viewer``. Russian changelog: https://github.com/SiTiROS/vibe-md-viewer/blob/main/CHANGELOG.ru.md"
          New-Item -ItemType Directory -Force out | Out-Null
          [IO.File]::WriteAllText('out/release-notes.md', $notes, (New-Object Text.UTF8Encoding $false))
          Copy-Item "dist/vibe-md-viewer-$env:VER-setup.exe", "dist/vibe-md-viewer-$env:VER.zip", "dist/vibe-md-viewer-$env:VER.sha256.txt", "dist/THIRD-PARTY-NOTICES.txt" out/

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.exe
            out/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          retention-days: 3

  publish:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VER: ${{ needs.check.outputs.ver }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The tag vX.Y.Z is created by the release itself, on the commit CI checked. (A tag made
        # with this token triggers no other workflows — no loops.)
        run: |
          gh release create "v$VER" \
            "out/vibe-md-viewer-$VER-setup.exe" \
            "out/vibe-md-viewer-$VER.zip" \
            "out/vibe-md-viewer-$VER.sha256.txt" \
            "out/THIRD-PARTY-NOTICES.txt" \
            --target "$SHA" \
            --title "vibe-md-viewer $VER" --notes-file out/release-notes.md
