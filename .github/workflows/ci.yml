# Checks every change: unit tests, release build, self-test on a live window.
# Only official GitHub actions (actions/*), pinned by commit SHA (a version tag can be moved,
# a SHA can't). The token is read-only and is not persisted in .git.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Unit tests (including on a real RichEdit)
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Self-test on a live window
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/selftest.ps1 -Exe target/release/vibe-md-viewer.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibe-md-viewer-${{ github.sha }}
          path: target/release/vibe-md-viewer.exe
          retention-days: 14

  coverage:
    name: Code coverage (unit tests + live-window self-test)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust stable + llvm-tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup default stable
          rustc --version

      - name: Measure coverage
        shell: pwsh
        run: |
          $bin = Join-Path (rustc --print sysroot) 'lib\rustlib\x86_64-pc-windows-msvc\bin'
          powershell -ExecutionPolicy Bypass -File scripts/coverage.ps1 -LlvmBin $bin -Html -MinLines 85
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          $s = '.toolcache/coverage/summary.txt'
          if (Test-Path $s) {
            "## Code coverage`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content $s | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-html-${{ github.sha }}
          path: .toolcache/coverage/html
          retention-days: 14
