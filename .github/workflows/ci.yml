# Checks every change: unit tests, release build, self-test on a live window.
# Only official GitHub actions (actions/*), pinned by commit SHA (a version tag can be moved,
# a SHA can't). The token is read-only and is not persisted in .git.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Unit tests (including on a real RichEdit)
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Self-test on a live window
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/selftest.ps1 -Exe target/release/vibe-md-viewer.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibe-md-viewer-${{ github.sha }}
          path: target/release/vibe-md-viewer.exe
          retention-days: 14
